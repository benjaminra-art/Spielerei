<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Spielerei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spielerei">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5bc0ff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#3a2314;
  --paper:#fff3c4;
  --yellow:#ffd23f;
  --red:#ee4b3c;
  --font:"Marker Felt","Chalkboard SE","Bradley Hand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --outline:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:linear-gradient(#5bc0ff 0,#bfeeff 200px,#7ada52 200px) fixed}
body{margin:0;min-height:100dvh;font-family:var(--font);font-weight:900;color:var(--ink);
  padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 40px)}
body::before{content:"";position:fixed;z-index:-1;pointer-events:none;left:-15%;right:-15%;top:170px;bottom:0;
  border-top:6px solid var(--ink);border-radius:50% 50% 0 0 / 36px 36px 0 0;
  background:repeating-linear-gradient(0deg,#7ada52 0 48px,#6fcf47 48px 96px)}
main{max-width:480px;margin:0 auto}
h1{margin:0 0 6px;font-size:54px;line-height:.95;color:#fff;text-shadow:var(--outline),0 6px 0 var(--ink);transform:rotate(-2deg);text-align:center}
.lead{margin:0 0 34px;text-align:center;font-size:19px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.games{display:grid;gap:22px;padding:0;margin:0;list-style:none}
.game{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:14px;text-decoration:none;color:inherit;
  background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.game:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.game:focus-visible{outline:4px solid var(--red);outline-offset:4px}
.game img{width:92px;height:92px;border:4px solid var(--ink);border-radius:20px;display:block}
.game h2{margin:0 0 4px;font-size:27px;line-height:1}
.game p{margin:0 0 8px;font-size:15px;line-height:1.25;font-weight:700}
.go{display:inline-block;padding:4px 14px 2px;font-size:17px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:14px;text-shadow:var(--outline);box-shadow:0 3px 0 var(--ink)}
.soon{display:grid;place-items:center;min-height:112px;padding:14px;text-align:center;font-size:19px;
  background:rgba(255,243,196,.55);border:4px dashed var(--ink);border-radius:26px}
.soon small{display:block;font-size:14px;font-weight:700;opacity:.75;margin-top:2px}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Spielerei</h1>
  <p class="lead">Kleine Spiele fürs iPhone</p>
  <ul class="games">
    <li>
      <a class="game" href="hau-den-erdi/">
        <img src="hau-den-erdi/apple-touch-icon.png" alt="" width="92" height="92">
        <div>
          <h2>Hau den Erdi!</h2>
          <p>Erdmännchen hauen, Helme knacken, Igel verschonen. 45 Sekunden.</p>
          <span class="go">SPIELEN</span>
        </div>
      </a>
    </li>
    <li class="soon">
      <div>Hier kommt das nächste Spiel<small>Noch ein freier Platz</small></div>
    </li>
  </ul>
</main>
</body>
</html>
