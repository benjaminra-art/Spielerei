<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hau den Erdi!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hau den Erdi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6cc8ff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#3a2314;
  --paper:#fff3c4;
  --red:#ee4b3c;
  --yellow:#ffd23f;
  --green:#6fd14b;
  --font:"Marker Felt","Chalkboard SE","Bradley Hand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --outline:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;overscroll-behavior:none;background:#6cc8ff;font-family:var(--font);font-weight:900;color:var(--ink);touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}

/* ---------- Szenerie ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#5bc0ff 0%,#a9e6ff 30%,#d9f6ff 45%)}
.sun{position:absolute;right:-30px;top:calc(env(safe-area-inset-top) + 70px);width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7a8,#ffd23f 70%);border:5px solid var(--ink);box-shadow:0 0 0 14px rgba(255,236,120,.35)}
.cloud{position:absolute;width:130px;height:60px;animation:drift linear infinite}
.cloud svg{width:100%;height:100%;overflow:visible}
.c1{top:calc(env(safe-area-inset-top) + 120px);left:-150px;animation-duration:48s}
.c2{top:calc(env(safe-area-inset-top) + 190px);left:-150px;animation-duration:70s;animation-delay:-30s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(calc(100vw + 320px))}}
.c2{animation-name:drift2}
@keyframes drift2{from{transform:translateX(0) scale(.7)}to{transform:translateX(calc(100vw + 320px)) scale(.7)}}
.field{position:absolute;left:-12%;right:-12%;top:22%;bottom:0;border-radius:50% 50% 0 0 / 7% 7% 0 0;border-top:6px solid var(--ink);
  background:repeating-linear-gradient(0deg,#7ada52 0 48px,#6fcf47 48px 96px)}
.field::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.28),transparent 55%)}
.flower{position:absolute;font-size:22px;filter:drop-shadow(0 2px 0 rgba(58,35,20,.5))}

/* ---------- HUD ---------- */
.hud{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:5px 12px 3px;text-align:center;min-width:92px}
.panel small{display:block;font-size:12px;letter-spacing:1px;opacity:.7;line-height:1.1}
.panel b{display:block;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
#timePanel.low{background:#ffb3a8;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.hud-right{display:flex;justify-content:flex-end;align-items:flex-start;gap:8px}
.roundbtn{width:48px;height:48px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:22px;line-height:1;display:grid;place-items:center}
.roundbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.timebar{position:relative;z-index:3;margin:14px 6px 0;height:16px;border:4px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.timebar i{position:absolute;inset:0;background:linear-gradient(#8dff6a,#3fc22b);transform-origin:left;transition:background .3s}
.timebar.low i{background:linear-gradient(#ff8a7a,#e23a2a)}
.combo{position:relative;z-index:3;height:34px;display:flex;justify-content:center;align-items:center;margin-top:6px}
.combo span{display:inline-block;padding:2px 14px 0;border:4px solid var(--ink);border-radius:20px;background:var(--yellow);box-shadow:0 4px 0 var(--ink);font-size:18px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.2,1.8,.4,1)}
.combo.on span{opacity:1;transform:scale(1)}
.combo.bump span{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.25) rotate(-4deg)}}

/* ---------- Spielfeld ---------- */
.stage{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{width:min(100%,calc((100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .75));aspect-ratio:3/4;display:grid;grid-template:repeat(4,1fr)/repeat(3,1fr)}
.cell{position:relative;touch-action:none}
.hole{position:absolute;left:3%;right:3%;bottom:5%;height:30%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#2b170c 0 55%,#4a2a15 56%);border:4px solid var(--ink);
  box-shadow:0 6px 0 #a5622e,0 6px 0 4px var(--ink),inset 0 -5px 0 rgba(0,0,0,.3)}
.clip{position:absolute;left:0;right:0;top:0;bottom:20%;overflow:hidden;pointer-events:none}
.mole{position:absolute;left:11%;bottom:0;width:78%;aspect-ratio:1;transform:translateY(106%);transition:transform .22s cubic-bezier(.5,0,.9,.5)}
.mole.up{transform:translateY(0);transition:transform .2s cubic-bezier(.2,1.7,.4,1)}
.mole svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%}
.eyes-x,.mouth-o{display:none}
.mole.hit .eyes-x,.mole.hit .mouth-o{display:inline}
.mole.hit .eyes-ok,.mole.hit .mouth-ok{display:none}
.helmet{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s}
.mole.nohelmet .helmet{transform:translate(18px,-46px) rotate(40deg);opacity:0}

/* ---------- Effekte ---------- */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
.hammer{position:absolute;width:var(--hw,70px);opacity:0;will-change:transform,opacity;filter:drop-shadow(0 5px 0 rgba(58,35,20,.35))}
.hammer svg{width:100%;display:block;overflow:visible}
.pop{position:absolute;white-space:nowrap;font-size:32px;transform:translate(-50%,-50%);text-shadow:var(--outline);color:#fff;pointer-events:none}
.pop.good{color:var(--yellow)}
.pop.bad{color:#ff6a5a}
.star{position:absolute;font-size:24px;color:var(--yellow);text-shadow:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink);transform:translate(-50%,-50%)}
.board.shake{animation:shake .25s}
@keyframes shake{20%{transform:translate(-6px,3px) rotate(-1deg)}40%{transform:translate(6px,-3px) rotate(1deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* ---------- Overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
  background:rgba(40,20,5,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .25s}
.overlay.hidden{opacity:0;pointer-events:none}
.card{width:min(100%,380px);background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px 18px 20px;text-align:center;animation:cardin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardin{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.title{margin:0;font-size:46px;line-height:.95;color:#fff;text-shadow:var(--outline),0 6px 0 var(--ink);transform:rotate(-2deg)}
.title em{font-style:normal;color:var(--yellow)}
.demo{width:130px;height:130px;margin:6px auto 0;animation:bob 1.1s ease-in-out infinite}
.demo svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.legend{list-style:none;margin:8px 0 14px;padding:0;display:grid;gap:6px;text-align:left}
.legend li{display:flex;align-items:center;gap:10px;font-size:17px;line-height:1.1;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 10px 4px 6px}
.legend .ic{width:40px;height:40px;flex:none}
.legend .ic svg{width:100%;height:100%}
.legend b{color:#c2271a}
.btn{display:inline-block;width:100%;padding:12px 10px 8px;font-size:30px;color:#fff;background:linear-gradient(#ff7a5c,#ee4b3c);border:5px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);text-shadow:var(--outline);letter-spacing:1px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.big{font-size:64px;line-height:1;margin:4px 0}
.sub{font-size:20px;margin:2px 0 10px}
.stats{display:flex;justify-content:space-around;gap:6px;margin:10px 0 14px;font-size:14px}
.stats div{flex:1;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 2px 2px}
.stats b{display:block;font-size:24px}
.badge{display:inline-block;background:var(--yellow);border:4px solid var(--ink);border-radius:16px;padding:2px 12px 0;transform:rotate(-3deg);margin-bottom:6px;box-shadow:0 4px 0 var(--ink);animation:bump .6s .3s both}
#count{position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;font-size:150px;color:#fff;text-shadow:var(--outline),0 8px 0 var(--ink)}
#count span{animation:cnt .8s both}
@keyframes cnt{0%{transform:scale(.2) rotate(-15deg);opacity:0}30%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:.0}}

.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  .rotate{display:grid;position:fixed;inset:0;z-index:99;place-items:center;background:var(--yellow);font-size:26px;text-align:center;padding:20px}
}
</style>
</head>
<body>
<div id="app">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="cloud c1"><svg viewBox="0 0 130 60"><path d="M20 54a18 18 0 0 1 2-35 26 26 0 0 1 48-6 22 22 0 0 1 38 12 16 16 0 0 1 6 29z" fill="#fff" stroke="#3a2314" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div class="cloud c2"><svg viewBox="0 0 130 60"><path d="M20 54a18 18 0 0 1 2-35 26 26 0 0 1 48-6 22 22 0 0 1 38 12 16 16 0 0 1 6 29z" fill="#fff" stroke="#3a2314" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div class="field">
    <span class="flower" style="left:7%;top:6%">🌼</span>
    <span class="flower" style="right:9%;top:9%">🌷</span>
    <span class="flower" style="left:12%;bottom:5%">🌻</span>
    <span class="flower" style="right:6%;bottom:8%">🌼</span>
  </div>

  <div class="hud">
    <div class="panel"><small>PUNKTE</small><b id="score">0</b></div>
    <div class="panel" id="timePanel"><small>ZEIT</small><b id="time">45</b></div>
    <div class="hud-right">
      <button class="roundbtn" id="mute" aria-label="Ton an/aus">🔊</button>
    </div>
  </div>
  <div class="timebar" id="timebar"><i id="timefill"></i></div>
  <div class="combo" id="combo"><span id="comboTxt">SERIE 0</span></div>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div id="count"></div>

  <div class="overlay" id="startOv">
    <div class="card">
      <h1 class="title">Hau den <em>Erdi!</em></h1>
      <div class="demo" id="demo"></div>
      <ul class="legend">
        <li><span class="ic" id="ic1"></span><span>Erdmännchen hauen: <b>+10</b></span></li>
        <li><span class="ic" id="ic2"></span><span>Mit Helm: <b>2× hauen</b>, +25</span></li>
        <li><span class="ic" id="ic3"></span><span>Igel: <b>Finger weg!</b> −20</span></li>
      </ul>
      <button class="btn" id="playBtn">LOS GEHT'S!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOv">
    <div class="card">
      <div class="badge" id="newBest" style="display:none">🏆 NEUER REKORD!</div>
      <h1 class="title" style="font-size:38px">Zeit um!</h1>
      <div class="big" id="finalScore">0</div>
      <div class="sub" id="rank">Punkte</div>
      <div class="stats">
        <div>Treffer<b id="stHits">0</b></div>
        <div>Daneben<b id="stMiss">0</b></div>
        <div>Beste Serie<b id="stCombo">0</b></div>
      </div>
      <div class="sub" style="font-size:16px;margin:-4px 0 12px">Rekord: <span id="best">0</span></div>
      <button class="btn" id="againBtn">NOCHMAL!</button>
    </div>
  </div>
</div>
<div class="rotate">📱↻<br>Bitte das iPhone hochkant halten!</div>

<script>
(() => {
'use strict';

/* =====================  Grafiken (SVG, selbst gezeichnet)  ===================== */
const INK = '#3a2314';

function meerkat(helmet) {
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="50" cy="82" rx="25" ry="30" fill="#d9a15f"/>
    <ellipse cx="50" cy="88" rx="15" ry="23" fill="#f6e2b8" stroke="none"/>
    <path d="M27 66q-3 6 0 12M73 66q3 6 0 12" fill="none" stroke="#8a5a2c" stroke-width="3"/>
    <ellipse cx="25" cy="33" rx="6" ry="8.5" fill="#5a3a22" transform="rotate(-15 25 33)"/>
    <ellipse cx="75" cy="33" rx="6" ry="8.5" fill="#5a3a22" transform="rotate(15 75 33)"/>
    <ellipse cx="34" cy="75" rx="6.5" ry="11" fill="#e8b573" transform="rotate(12 34 75)"/>
    <ellipse cx="66" cy="75" rx="6.5" ry="11" fill="#e8b573" transform="rotate(-12 66 75)"/>
    <path d="M31 84l1.5 3M35 85l.5 3.5M38.5 84l-1 3.5M69 84l-1.5 3M65 85l-.5 3.5M61.5 84l1 3.5" stroke-width="2" fill="none"/>
    <ellipse cx="50" cy="39" rx="26" ry="23" fill="#e8b573"/>
    <path d="M47 17q3-6 6 0M41 18q1-5 5-3M54 15q4-2 5 3" fill="none" stroke-width="2.5"/>
    <ellipse cx="38" cy="38" rx="9.5" ry="8.5" fill="#5a3a22" stroke="none" transform="rotate(-20 38 38)"/>
    <ellipse cx="62" cy="38" rx="9.5" ry="8.5" fill="#5a3a22" stroke="none" transform="rotate(20 62 38)"/>
    <ellipse cx="50" cy="51" rx="11" ry="8.5" fill="#f6e2b8"/>
    <ellipse cx="50" cy="46.5" rx="4.5" ry="3.3" fill="#2a1a12" stroke="none"/>
    <g class="mouth-ok"><path d="M44.5 54.5q5.5 4.5 11 0" fill="none" stroke-width="2.5"/><rect x="47.5" y="55" width="5" height="5.5" rx="1" fill="#fff" stroke-width="2"/></g>
    <ellipse class="mouth-o" cx="50" cy="56.5" rx="4" ry="4.5" fill="#7a1f2b" stroke-width="2.5"/>
    <g class="eyes-ok">
      <circle cx="38" cy="38" r="6.2" fill="#fff" stroke-width="2.5"/><circle cx="39.3" cy="39" r="3.2" fill="#2a1a12" stroke="none"/><circle cx="40.5" cy="37.4" r="1.2" fill="#fff" stroke="none"/>
      <circle cx="62" cy="38" r="6.2" fill="#fff" stroke-width="2.5"/><circle cx="60.7" cy="39" r="3.2" fill="#2a1a12" stroke="none"/><circle cx="62" cy="37.4" r="1.2" fill="#fff" stroke="none"/>
    </g>
    <g class="eyes-x" stroke="#fff" stroke-width="3.2" fill="none"><path d="M33 33l10 10M43 33l-10 10M57 33l10 10M67 33l-10 10"/></g>
    ${helmet ? `<g class="helmet">
      <path d="M23 29Q50-8 77 29Z" fill="#ffd23f"/>
      <path d="M33 22q10-10 22-9" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
      <rect x="45" y="9" width="10" height="20" rx="3" fill="#ff9d2e"/>
      <rect x="17" y="26" width="66" height="7" rx="3.5" fill="#ffd23f"/>
    </g>` : ''}
  </g></svg>`;
}

function hedgehog() {
  let d = '';
  const cx = 50, cy = 64;
  for (let i = 0, a = 178; a >= 2; a -= 9, i++) {
    const r = i % 2 ? 38 : 48, rad = a * Math.PI / 180;
    d += (i ? 'L' : 'M') + (cx + r * Math.cos(rad)).toFixed(1) + ' ' + (cy - r * Math.sin(rad)).toFixed(1);
  }
  d += 'L97 84Q92 100 70 100L30 100Q8 100 3 84Z';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="${d}" fill="#7a5bb5"/>
    <ellipse cx="50" cy="84" rx="30" ry="24" fill="#a98ad8"/>
    <ellipse cx="50" cy="66" rx="25" ry="21" fill="#f3d9bf"/>
    <ellipse cx="50" cy="72" rx="12" ry="8.5" fill="#e9bf96"/>
    <circle cx="50" cy="68.5" r="4.6" fill="#2a1a12" stroke="none"/>
    <circle cx="33" cy="72" r="4.5" fill="#ff9fb6" stroke="none"/><circle cx="67" cy="72" r="4.5" fill="#ff9fb6" stroke="none"/>
    <g class="mouth-ok"><path d="M45 76q5 4 10 0" fill="none" stroke-width="2.5"/></g>
    <ellipse class="mouth-o" cx="50" cy="78" rx="3.5" ry="4" fill="#7a1f2b" stroke-width="2.5"/>
    <g class="eyes-ok">
      <circle cx="39" cy="58" r="5" fill="#2a1a12" stroke="none"/><circle cx="40.6" cy="56.3" r="1.7" fill="#fff" stroke="none"/>
      <circle cx="61" cy="58" r="5" fill="#2a1a12" stroke="none"/><circle cx="62.6" cy="56.3" r="1.7" fill="#fff" stroke="none"/>
    </g>
    <g class="eyes-x" stroke="#2a1a12" stroke-width="3.2" fill="none"><path d="M34 53l10 10M44 53l-10 10M56 53l10 10M66 53l-10 10"/></g>
  </g></svg>`;
}

const HAMMER = `<svg viewBox="0 0 100 150" aria-hidden="true">
  <g stroke="${INK}" stroke-width="5" stroke-linejoin="round">
    <rect x="43" y="40" width="14" height="104" rx="7" fill="#c98d4b"/>
    <rect x="46" y="48" width="4" height="88" rx="2" fill="#e6b073" stroke="none"/>
    <rect x="8" y="6" width="84" height="46" rx="12" fill="#ee4b3c"/>
    <rect x="8" y="6" width="16" height="46" rx="8" fill="#ffd23f"/>
    <rect x="76" y="6" width="16" height="46" rx="8" fill="#ffd23f"/>
    <path d="M32 15h38" stroke="#fff" stroke-width="5" opacity=".6" fill="none"/>
  </g></svg>`;

/* =====================  Hilfsfunktionen  ===================== */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* =====================  Ton & Haptik  ===================== */
let AC = null;
let muted = store.get('erdi-muted', '0') === '1';

function audioUnlock() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') AC.resume().catch(() => {});
}
function tone(f1, f2, dur, type = 'sine', vol = .25, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + .03);
}
function noise(dur, vol = .3, delay = 0, cutoff = 1800) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
const sfx = {
  pop()   { tone(280, 620, .09, 'sine', .15); },
  bonk()  { noise(.08, .35, 0, 2500); tone(260, 70, .2, 'square', .22); tone(520, 180, .12, 'triangle', .18); },
  clang() { tone(1300, 1250, .22, 'triangle', .22); tone(1950, 1900, .16, 'sine', .14); noise(.04, .25, 0, 6000); },
  bad()   { tone(190, 70, .45, 'sawtooth', .22); tone(150, 60, .45, 'square', .12, .05); },
  miss()  { noise(.09, .18, 0, 700); tone(120, 70, .1, 'sine', .15); },
  combo(n){ const b = 520 + n * 70; tone(b, b, .08, 'square', .1); tone(b * 1.5, b * 1.5, .12, 'square', .1, .07); },
  tick()  { tone(660, 660, .09, 'square', .12); },
  go()    { tone(880, 1320, .25, 'square', .14); },
  end()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .18, 'square', .13, i * .12)); },
  best()  { [784, 988, 1175, 1568, 1175, 1568].forEach((f, i) => tone(f, f, .15, 'triangle', .18, .5 + i * .1)); }
};

// Vibration: Android per Vibration-API. iOS Safari kennt sie nicht -> Umweg
// ueber einen unsichtbaren <input switch>, der beim Umschalten ein haptisches Tick gibt.
const hapLabel = document.createElement('label');
hapLabel.setAttribute('aria-hidden', 'true');
hapLabel.style.cssText = 'position:fixed;left:-60px;top:0;width:40px;height:30px;opacity:.01;pointer-events:none;';
hapLabel.innerHTML = '<input type="checkbox" switch tabindex="-1">';
document.body.appendChild(hapLabel);
function haptic(ms = 15) {
  if (muted) return;
  try {
    if (navigator.vibrate) { navigator.vibrate(ms); return; }
    hapLabel.click();
  } catch (e) {}
}

/* =====================  Spielzustand  ===================== */
const DURATION = 45;
const board = $('#board'), fx = $('#fx'), stage = $('#stage');
const el = {
  score: $('#score'), time: $('#time'), timePanel: $('#timePanel'), timebar: $('#timebar'), fill: $('#timefill'),
  combo: $('#combo'), comboTxt: $('#comboTxt'), start: $('#startOv'), end: $('#endOv'), count: $('#count')
};

const cells = [];
for (let i = 0; i < 12; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = '<div class="hole"></div><div class="clip"><div class="mole"></div></div>';
  c.dataset.i = i;
  board.appendChild(c);
  cells.push({ el: c, mole: c.querySelector('.mole'), state: 'empty', type: null, hp: 0, until: 0 });
}

let gt = 0, running = false, score = 0, combo = 0, bestCombo = 0, hits = 0, misses = 0, nextSpawn = 0;
let best = parseInt(store.get('erdi-best', '0'), 10) || 0;
let timeLeft = DURATION;

function mult() { return Math.min(5, 1 + Math.floor(combo / 5)); }

function setScore(v) { score = Math.max(0, v); el.score.textContent = score; }
function updateCombo(bump) {
  el.combo.classList.toggle('on', combo >= 3);
  if (combo >= 3) {
    el.comboTxt.textContent = `SERIE ${combo}` + (mult() > 1 ? `  ·  ×${mult()}` : '');
    if (bump) { el.combo.classList.remove('bump'); void el.combo.offsetWidth; el.combo.classList.add('bump'); }
  }
}

/* ---------- Schwierigkeit ---------- */
function difficulty() {
  const p = Math.min(1, gt / (DURATION * 1000));
  return {
    interval: lerp(850, 330, p),
    up: lerp(1250, 600, p),
    max: p < .3 ? 2 : p < .65 ? 3 : 4,
    helmet: p < .1 ? 0 : .2,
    igel: p < .05 ? 0 : .16
  };
}

function spawn() {
  const free = cells.filter(c => c.state === 'empty');
  if (!free.length) return;
  const d = difficulty(), c = pick(free), r = Math.random();
  c.type = r < d.igel ? 'igel' : r < d.igel + d.helmet ? 'helmet' : 'normal';
  c.hp = c.type === 'helmet' ? 2 : 1;
  c.mole.classList.remove('hit', 'nohelmet');
  c.mole.innerHTML = c.type === 'igel' ? hedgehog() : meerkat(c.type === 'helmet');
  void c.mole.offsetWidth;
  c.mole.classList.add('up');
  c.state = 'up';
  c.until = gt + d.up * rand(.85, 1.15);
  sfx.pop();
}

function retreat(c) {
  c.mole.classList.remove('up');
  c.state = 'down';
  c.until = gt + 280;
}

/* ---------- Effekte ---------- */
function cellPoint(c) {
  const sr = stage.getBoundingClientRect(), cr = c.el.getBoundingClientRect();
  return { x: cr.left - sr.left + cr.width / 2, y: cr.top - sr.top + cr.height * .38, w: cr.width };
}

function swingHammer(c) {
  const p = cellPoint(c);
  const h = document.createElement('div');
  h.className = 'hammer';
  h.style.setProperty('--hw', p.w * .62 + 'px');
  h.innerHTML = HAMMER;
  h.style.left = p.x + 'px';
  h.style.top = p.y + 'px';
  fx.appendChild(h);
  const base = 'translate(-50%,-20%)';
  const a = h.animate([
    { transform: `${base} translateY(-55px) rotate(-60deg)`, opacity: 0 },
    { transform: `${base} translateY(-22px) rotate(-32deg)`, opacity: 1, offset: .2 },
    { transform: `${base} translateY(6px) rotate(10deg) scale(1.1)`, opacity: 1, offset: .42 },
    { transform: `${base} translateY(6px) rotate(8deg) scale(1)`, opacity: 1, offset: .75 },
    { transform: `${base} translateY(-12px) rotate(-12deg)`, opacity: 0 }
  ], { duration: 400, easing: 'ease-out' });
  a.onfinish = () => h.remove();
}

function popText(p, text, cls, dy = -60) {
  const t = document.createElement('div');
  t.className = 'pop ' + cls;
  t.textContent = text;
  t.style.left = p.x + 'px';
  t.style.top = (p.y - 10) + 'px';
  fx.appendChild(t);
  const rot = rand(-12, 12);
  const a = t.animate([
    { transform: `translate(-50%,-50%) scale(.3) rotate(${rot}deg)`, opacity: 0 },
    { transform: `translate(-50%,-50%) scale(1.25) rotate(${rot}deg)`, opacity: 1, offset: .2 },
    { transform: `translate(-50%,calc(-50% + ${dy}px)) scale(1) rotate(${rot}deg)`, opacity: 0 }
  ], { duration: 750, easing: 'ease-out' });
  a.onfinish = () => t.remove();
}

function stars(p, n = 4) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'star'; s.textContent = '★';
    s.style.left = p.x + 'px'; s.style.top = (p.y - 6) + 'px';
    fx.appendChild(s);
    const ang = (i / n) * Math.PI * 2 + rand(0, 1), r = p.w * rand(.35, .6);
    const a = s.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(ang) * r}px),calc(-50% + ${Math.sin(ang) * r * .6 - 14}px)) scale(1.1) rotate(180deg)`, opacity: 0 }
    ], { duration: 520, easing: 'ease-out' });
    a.onfinish = () => s.remove();
  }
}

function squash(c) {
  const svg = c.mole.querySelector('svg');
  if (svg) svg.animate([
    { transform: 'scale(1,1)' },
    { transform: 'scale(1.18,.62)', offset: .3 },
    { transform: 'scale(.95,1.06)', offset: .65 },
    { transform: 'scale(1,1)' }
  ], { duration: 280, easing: 'ease-out' });
}

const WORDS = ['BONK!', 'POW!', 'WUMMS!', 'KLONK!', 'BAMM!', 'ZACK!'];

/* ---------- Eingabe ---------- */
function whack(c) {
  const p = cellPoint(c);
  swingHammer(c);

  if (c.state !== 'up') {          // daneben
    misses++;
    if (combo >= 3) popText(p, 'Serie weg!', 'bad', -40);
    combo = 0; updateCombo();
    sfx.miss();
    return;
  }

  if (c.type === 'igel') {
    c.mole.classList.add('hit');
    c.state = 'hit'; c.until = gt + 350;
    combo = 0; updateCombo();
    setScore(score - 20);
    popText(p, 'AUTSCH! −20', 'bad');
    stars(p, 3); squash(c);
    sfx.bad(); haptic(60);
    board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    return;
  }

  if (c.type === 'helmet' && c.hp > 1) {   // Helm geht ab
    c.hp--;
    c.mole.classList.add('nohelmet');
    c.until = Math.max(c.until, gt + 700);
    setScore(score + 5);
    popText(p, 'KLONK!', 'good');
    squash(c);
    sfx.clang(); haptic(25);
    return;
  }

  c.mole.classList.add('hit');
  c.state = 'hit'; c.until = gt + 320;
  hits++; combo++;
  bestCombo = Math.max(bestCombo, combo);
  const pts = (c.type === 'helmet' ? 25 : 10) * mult();
  setScore(score + pts);
  popText(p, mult() > 1 ? `+${pts}` : pick(WORDS), 'good');
  stars(p, 4); squash(c);
  sfx.bonk(); haptic(20);
  if (combo % 5 === 0) sfx.combo(combo / 5);
  updateCombo(true);
}

board.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  if (!running) return;
  const t = e.target.closest('.cell');
  if (t) whack(cells[+t.dataset.i]);
});

/* ---------- Spielschleife ---------- */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - last, 100);
  last = now;
  if (!running) return;
  gt += dt;

  timeLeft = Math.max(0, DURATION - gt / 1000);
  el.time.textContent = Math.ceil(timeLeft);
  el.fill.style.transform = `scaleX(${timeLeft / DURATION})`;
  const low = timeLeft <= 10;
  el.timePanel.classList.toggle('low', low);
  el.timebar.classList.toggle('low', low);

  if (timeLeft <= 0) { endGame(); return; }

  const d = difficulty();
  const active = cells.filter(c => c.state === 'up' || c.state === 'hit').length;
  if (gt >= nextSpawn && active < d.max) {
    spawn();
    nextSpawn = gt + d.interval * rand(.7, 1.3);
  }

  for (const c of cells) {
    if (c.state === 'up' && gt >= c.until) {
      if (c.type !== 'igel' && combo) { combo = 0; updateCombo(); }
      retreat(c);
    } else if (c.state === 'hit' && gt >= c.until) retreat(c);
    else if (c.state === 'down' && gt >= c.until) c.state = 'empty';
  }
}
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- Ablauf ---------- */
function resetBoard() {
  for (const c of cells) {
    c.mole.classList.remove('up', 'hit', 'nohelmet');
    c.state = 'empty';
  }
}

function startGame() {
  audioUnlock();
  resetBoard();
  el.start.classList.add('hidden');
  el.end.classList.add('hidden');
  gt = 0; score = 0; combo = 0; bestCombo = 0; hits = 0; misses = 0; nextSpawn = 700;
  timeLeft = DURATION;
  setScore(0); updateCombo();
  el.time.textContent = DURATION;
  el.fill.style.transform = 'scaleX(1)';
  el.timePanel.classList.remove('low'); el.timebar.classList.remove('low');

  const seq = ['3', '2', '1', 'LOS!'];
  seq.forEach((s, i) => setTimeout(() => {
    el.count.innerHTML = `<span style="${s === 'LOS!' ? 'font-size:100px' : ''}">${s}</span>`;
    i < 3 ? sfx.tick() : sfx.go();
    if (i === 3) { running = true; setTimeout(() => el.count.innerHTML = '', 600); }
  }, i * 750));
}

function endGame() {
  running = false;
  for (const c of cells) if (c.state === 'up') retreat(c);
  el.timePanel.classList.remove('low'); el.timebar.classList.remove('low');
  el.combo.classList.remove('on');
  el.time.textContent = 0;

  const isBest = score > best;
  if (isBest) { best = score; store.set('erdi-best', String(best)); }

  $('#finalScore').textContent = score;
  $('#stHits').textContent = hits;
  $('#stMiss').textContent = misses;
  $('#stCombo').textContent = bestCombo;
  $('#best').textContent = best;
  $('#newBest').style.display = isBest && score > 0 ? 'inline-block' : 'none';
  $('#rank').textContent =
    score >= 700 ? 'Erdmännchen-Legende! 🏆' :
    score >= 450 ? 'Hammer-Meister! 🔨' :
    score >= 250 ? 'Ganz ordentlich! 👍' :
    score >= 100 ? 'Da geht noch was!' : 'Die Erdis lachen dich aus…';

  sfx.end(); if (isBest && score > 0) sfx.best();
  setTimeout(() => el.end.classList.remove('hidden'), 700);
}

$('#playBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);

/* ---------- Mute ---------- */
const muteBtn = $('#mute');
function paintMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
paintMute();
muteBtn.addEventListener('click', () => { muted = !muted; store.set('erdi-muted', muted ? '1' : '0'); paintMute(); audioUnlock(); });

/* ---------- Startbildschirm-Grafiken ---------- */
$('#demo').innerHTML = meerkat(false);
$('#ic1').innerHTML = meerkat(false);
$('#ic2').innerHTML = meerkat(true);
$('#ic3').innerHTML = hedgehog();

/* ---------- iOS: Zoom/Scroll-Gesten unterbinden ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
